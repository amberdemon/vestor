name: Scaffold checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Backend checks
        run: docker build --target backend-checks .
      - name: Frontend checks
        run: docker build --target frontend-checks .
      - name: Compose smoke test
        run: |
          docker compose up --build -d
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/ | grep -F '<title>Vestor</title>'
          test "$(curl --fail --silent http://127.0.0.1:8000/api/health)" = '{"status":"ok"}'
          test "$(docker compose port app 8000)" = '127.0.0.1:8000'
          docker compose down
          docker compose up --no-build --pull never -d
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/api/health
      - name: Verify rendered shell
        run: |
          google-chrome --headless --no-sandbox --disable-background-networking --proxy-server=127.0.0.1:1 \
            --virtual-time-budget=5000 --window-size=1000,600 \
            --screenshot="${RUNNER_TEMP}/vestor-shell.png" --dump-dom http://127.0.0.1:8000/ > "${RUNNER_TEMP}/vestor-shell.html"
          grep -F 'Local API connected.' "${RUNNER_TEMP}/vestor-shell.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vestor-shell
          path: ${{ runner.temp }}/vestor-shell.png
          if-no-files-found: error
      - name: Stop Compose
        if: always()
        run: docker compose down
