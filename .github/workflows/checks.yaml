name: Local calculator checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Backend checks
        run: docker build --target backend-checks .
      - name: Frontend checks
        run: docker build --target frontend-checks .
      - name: Compose smoke test
        run: |
          docker compose up --build -d
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/ | grep -F '<title>Vestor</title>'
          test "$(curl --fail --silent http://127.0.0.1:8000/api/health)" = '{"status":"ok"}'
          test "$(docker compose port app 8000)" = '127.0.0.1:8000'
          docker compose down
          docker compose up --no-build --pull never -d
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/api/health
      - name: Disconnected runtime calculation and assets
        run: |
          docker run --rm --network none \
            -v "$PWD/backend/tests/offline_smoke.py:/app/offline_smoke.py:ro" \
            --entrypoint python "$(docker compose images -q app)" /app/offline_smoke.py
      - name: Browser calculator scenarios (desktop and mobile)
        run: |
          docker run --rm --network host -e CI=1 -v "$PWD/frontend:/app" -w /app node:24.18.0-bookworm-slim \
            sh -c 'npm ci && npm exec -- playwright install --with-deps chromium && npm run e2e'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: vestor-calculator-browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: error
      - name: Stop Compose
        if: always()
        run: docker compose down
